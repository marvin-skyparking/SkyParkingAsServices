version: '3.8'
services:
  app:
    container_name: 'AUTOENTRY'

    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      # - shared/upload_on:/app/uploads
    environment:
      - PORT=9000
    ports:
      - "7500:9000"
    # command: npm install cookie-parser && npm start
    networks:
      - AUTOENTRY

volumes:
  node_modules:

networks:
  AUTOENTRY:
    driver: bridge
